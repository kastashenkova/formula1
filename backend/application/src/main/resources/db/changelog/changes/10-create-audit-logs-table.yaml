databaseChangeLog:
  - changeSet:
      id: 10-create-audit-logs-table
      author: formula1_team
      changes:
        - createTable:
            tableName: audit_log
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: action
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: true
              - column:
                  name: method_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: arguments
                  type: varchar(2048)
                  constraints:
                    nullable: true
              - column:
                  name: result
                  type: varchar(2048)
                  constraints:
                    nullable: true
              - column:
                  name: error_message
                  type: varchar(2048)
                  constraints:
                    nullable: true
              - column:
                  name: success
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: timestamp
                  type: timestamp
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: audit_log
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_audit_logs_users
            onDelete: SET NULL
