databaseChangeLog:
  - changeSet:
      id: 06-create-telemetry-points-table
      author: formula1_team
      changes:
        - createTable:
            tableName: telemetry_points
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: x
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: y
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: timestamp
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: driver_id
                  type: uuid
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: telemetry_points
            baseColumnNames: driver_id
            referencedTableName: drivers
            referencedColumnNames: id
            constraintName: fk_telemetry_points_drivers
