<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{error.403.title})}">
    <title th:text="${title}">403 Forbidden</title>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container is-max-desktop mt-6">
    <div class="box has-text-centered py-6">
        <h1 class="title is-3 has-text-danger" th:text="#{error.403.title}">Access denied</h1>
        <p class="subtitle is-5 has-text-grey mt-3 mb-5" th:text="#{error.403.text}">Your role has not enough permissions to complete the action</p>
        <a th:href="@{/races}" class="button is-link is-outlined" th:text="#{error.back}">Return to the list</a>
    </div>
</main>
</body>
</html>
