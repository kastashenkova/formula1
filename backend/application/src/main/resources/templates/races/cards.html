<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{races.title})}">
    <title th:text="${title}">Race Cards</title>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container mt-5">
    <div class="is-flex is-justify-content-space-between is-align-items-center mb-5">
        <h1 class="title is-3 mb-0" th:text="#{races.heading}">Registered races</h1>
        <div class="buttons">
            <a th:href="@{/races(view='TABLE')}" class="button is-light" th:text="#{races.view.table}">Таблиця</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/races/new}" class="button is-primary" th:text="#{races.add}">Додати гонку</a>
        </div>
    </div>

    <div class="columns is-multiline">
        <div class="column is-4" th:each="race : ${races}">
            <div class="card h-100">
                <div class="card-content">
                    <h2 class="title is-5" th:text="${race.raceId}">RACE-01</h2>
                    <p class="subtitle is-6 mt-2">
                        <strong th:text="${race.raceName}">Grand Prix</strong><br>
                        <span class="has-text-grey" th:text="${race.raceDate}">2026-10-10</span>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
