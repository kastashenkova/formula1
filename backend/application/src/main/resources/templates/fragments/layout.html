<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}">
    <title th:text="${title}">Formula1</title>
    <link rel="stylesheet" th:href="@{/css/bulma.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:fragment="navbar" class="navbar is-dark mb-4" role="navigation" aria-label="main navigation">
    <div class="container">
        <div class="navbar-brand">
            <a class="navbar-item" th:href="@{/races}" th:text="#{app.title}">Formula1</a>
        </div>

        <div class="navbar-menu is-active">
            <div class="navbar-end">
                <div class="navbar-item is-flex is-align-items-center">
                    <span sec:authorize="isAuthenticated()" class="has-text-light mr-3">
                        <span th:text="#{nav.user}">User</span>: <strong class="has-text-light" sec:authentication="name">Admin</strong>
                    </span>
                    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="button is-light is-outlined is-small" th:text="#{nav.logout}">Logout</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
