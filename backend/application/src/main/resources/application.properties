server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:file:./backend/application/.env[.properties]

server.port=8080
spring.application.name=backend

spring.mvc.problem-details.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.default-property-inclusion=non_null
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:3000000}
jwt.secret=${JWT_SECRET:my_super_secret_key_for_formula1_app_which_is_long_enough_2026}
jwt.issuer=${JWT_ISSUER:formula1}
jwt.audience=${JWT_AUDIENCE:formula1}

spring.messages.basename=messages
spring.messages.encoding=UTF-8

spring.cache.type=simple

spring.modulith.events.republish-outstanding-events-on-restart=true
spring.modulith.events.jdbc.schema-initialization.enabled=true

formula1.notification.email.host=smtp.gmail.com
formula1.notification.email.port=587
formula1.notification.email.username=${MAIL_USERNAME}
formula1.notification.email.password=${MAIL_PASSWORD}
formula1.notification.email.auth=true
formula1.notification.email.starttls-enable=true
formula1.notification.email-token-expiry-hours=${EMAIL_TOKEN_EXPIRY_DATE:24}
formula1.notification.phone-token-expiry-hours=${PHONE_TOKEN_EXPIRY_DATE:24}
formula1.notification.whatsapp.token=${META_ACCESS_TOKEN:dev-token}
formula1.notification.whatsapp.phone-number-id=${PHONE_NUMBER_ID:0}
formula1.notification.whatsapp.api-url=https://graph.facebook.com/v25.0
formula1.notification.enabled=true

logging.level.root=INFO
logging.level.org.example=DEBUG
logging.pattern.console="%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-NO_TRACE}] %-5level %logger{36} - %msg%n"

server.servlet.session.cookie.name=Formula1_Session

spring.web.resources.chain.enabled=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.chain.cache=true

management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
management.info.process.enabled=true
management.server.port=8081
management.endpoints.access.default=read-only
management.endpoints.web.exposure.include=health, info, metrics, prometheus, loggers, env, beans, mappings, configprops, conditions, threaddump, heapdump, httpexchanges, auditevents, logfile, startup, scheduledtasks, customapp, features, shutdown
management.endpoint.loggers.access=unrestricted
management.endpoint.features.access=unrestricted
management.endpoint.customapp.access=unrestricted
management.endpoint.shutdown.access=unrestricted
management.endpoint.heapdump.access=read-only
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.env.show-values=when-authorized
management.endpoint.env.roles=ADMIN
management.endpoint.configprops.show-values=when-authorized
management.endpoint.configprops.roles=ADMIN
info.app.name=Actuator Formula-1 Service
info.app.description=Spring Boot Actuator
info.app.version=1.0.0
info.organization=Kyiv-Mohyla Academy
