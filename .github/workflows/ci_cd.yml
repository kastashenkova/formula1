name: Java CI/CD

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build Project
        run: mvn --batch-mode install

      - name: Check for Exception Swallowing
        run: |
          python3 -c "
          import os, re, sys
          pattern = re.compile(r'catch\s*\([^)]+\)\s*\{\s*\}', re.MULTILINE)
          found = False
          
          for root, _, files in os.walk('.'):
              for file in files:
                  if file.endswith('.java'):
                      path = os.path.join(root, file)
                      with open(path, 'r', encoding='utf-8') as f:
                          if pattern.search(f.read()):
                              print(f'ERROR: Empty catch found in file {path}')
                              found = True
          if found:
              print('Build ended. Add logging or fix exception!')
              sys.exit(1)
          
          print('Audit complete')
          "

      - name: Analyze with SonarQube
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=maven-scan

      - name: Build Docker image for application
        run: mvn spring-boot:build-image -pl backend/application