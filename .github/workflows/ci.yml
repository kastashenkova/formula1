name: Java CI

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build Project
        run: mvn --batch-mode install

      - name: Check for Exception Swallowing
        run: |
          python3 -c "
          import os, re, sys
          pattern = re.compile(r'catch\s*\([^)]+\)\s*\{\s*\}', re.MULTILINE)
          found = False
          
          for root, _, files in os.walk('.'):
              for file in files:
                  if file.endswith('.java'):
                      path = os.path.join(root, file)
                      with open(path, 'r', encoding='utf-8') as f:
                          if pattern.search(f.read()):
                              print(f'ERROR: Empty catch found in file {path}')
                              found = True
          if found:
              print('Build ended. Add logging or fix exception!')
              sys.exit(1)
          
          print('Audit complete')
          "
